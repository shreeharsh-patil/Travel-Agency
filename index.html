<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0c0c" />

  <!-- Primary SEO -->
  <title>Horizon Travels — Luxury Private Jets, Villas & Curated Global Experiences</title>
  <meta name="description" content="Horizon Travels is a premium luxury travel agency — private aviation, exclusive villas, curated experiences, and a 24/7 global concierge. Plan your bespoke journey today." />
  <meta name="keywords" content="luxury travel, private jets, luxury villas, travel agency, curated experiences, global concierge, bespoke itineraries, Horizon Travels" />
  <meta name="author" content="Horizon Travels" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://horizontravels.example.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Horizon Travels" />
  <meta property="og:title" content="Horizon Travels — Luxury Travel, Reimagined" />
  <meta property="og:description" content="Private jets, exclusive villas, curated experiences, and a 24/7 global concierge. Explore the extraordinary." />
  <!-- Update the example domain to your production domain before deploying. -->
  <meta property="og:image" content="https://horizontravels.example.com/images/private_jet.png" />
  <meta property="og:url" content="https://horizontravels.example.com/" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Horizon Travels — Luxury Travel, Reimagined" />
  <meta name="twitter:description" content="Private jets, exclusive villas, curated experiences, and a 24/7 global concierge." />
  <meta name="twitter:image" content="https://horizontravels.example.com/images/private_jet.png" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Horizon Travels" />

  <!-- Performance: preconnect -->
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://maps.google.com" />
  <link rel="preconnect" href="https://www.google.com" />

  <!-- Structured Data: Travel Agency -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Horizon Travels",
      "description": "Premium luxury travel agency offering private aviation, exclusive villas, curated experiences, and global concierge services.",
      "url": "https://horizontravels.example.com/",
      "logo": "/vite.svg",
      "priceRange": "₹₹₹₹",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
